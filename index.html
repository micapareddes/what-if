<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E SE? — Random Identity Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23B8264F' d='M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z'/%3E%3C/svg%3E" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" /></symbol>
  </svg>

  <main class="page">
    <header class="masthead">
      <p class="eyebrow">Random Identity Generator</p>
      <h1 class="title">E SE?</h1>
      <svg class="spark spark--title" aria-hidden="true"><use href="#spark" /></svg>
    </header>

    <section class="slots" aria-live="polite">
      <article class="card card--category">
        <h2 class="label">Categoria</h2>
        <div class="window" data-col="category"><div class="strip"></div></div>
        <svg class="spark" aria-hidden="true"><use href="#spark" /></svg>
      </article>

      <article class="card card--name">
        <h2 class="label">Nome</h2>
        <div class="window" data-col="name"><div class="strip"></div></div>
        <svg class="spark" aria-hidden="true"><use href="#spark" /></svg>
      </article>

      <article class="card card--ref">
        <div class="frame">
          <h2 class="label">Referência</h2>
          <div class="window" data-col="ref"><div class="strip"></div></div>
          <svg class="spark" aria-hidden="true"><use href="#spark" /></svg>
        </div>
      </article>

      <article class="card card--image">
        <h2 class="label">Imagem</h2>
        <div class="window window--image" data-col="image"><div class="strip"></div></div>
      </article>
    </section>

    <button class="spin" type="button">
      <svg class="spark" aria-hidden="true"><use href="#spark" /></svg>
      <span>Randomize</span>
      <svg class="spark" aria-hidden="true"><use href="#spark" /></svg>
    </button>

    <footer class="foot">The Brisa Studio</footer>
  </main>

  <script src="data/categories.js"></script>
  <script src="data/names.js"></script>
  <script src="data/references.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
